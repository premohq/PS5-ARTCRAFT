name: Build environment

# The PC build's container (build/Dockerfile) and the quick part of build/build.sh: the toolchain is the pinned one,
# the sources check out at their pins with ArtCraft's patches, and every pinned input of the fork's build answers at
# its URL (the fork's tools/fetch-all.sh --check). The build itself takes hours on a PC and is not run here.

on:
  push:
    paths: ['build/**', 'mihawk/**', '.github/workflows/build-env.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: build.sh --check in the build container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The build container (Arch Linux snapshot, clang/LLD 23.1.3, MinGW)
        run: docker build -t artcraft-build build
      - name: The toolchain, the sources at their pins with the patches, and every pinned input's URL
        run: docker run --rm -v "$PWD":/src artcraft-build bash /src/build/build.sh --check

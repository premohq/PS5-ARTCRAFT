name: Root-access daemon

# The title ships a Lapy root-access daemon built for its own title id, and tools/build-production.sh takes only the
# one whose SHA-256 it pins. Mihawk OS's pin is for PPSA99170, so ArtCraft (PPSA99278) needs a pin of its own. This
# builds both from the same pinned inputs with clang/LLD 23.1.3 as Arch Linux packages them, the build the owner's
# CachyOS uses: LLVM's own release makes the same code but names its source revision in .comment, which changes the
# file (the first runs of this workflow). Mihawk OS's daemon must reproduce its pin, which proves the toolchain;
# ArtCraft's must match mihawk/mihawk.lock.json's, which patch 0007 puts into build-production.sh.

on:
  push:
    paths: ['mihawk/**', '.github/workflows/daemon.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon for PPSA99170 (reproduces Mihawk OS's pin) and PPSA99278 (ArtCraft's)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      LLVM_VERSION: 23.1.3
    steps:
      - name: Arch Linux's clang, LLD and LLVM 23.1.3 (from the Arch Linux Archive), Python and git
        run: |
          pacman -Syu --noconfirm --needed git python patch unzip curl
          archive=https://archive.archlinux.org/packages
          urls=()
          for name in llvm-libs llvm clang-libs clang lld compiler-rt; do
            file=$(curl -sSf "$archive/${name:0:1}/$name/" | grep -o "\"$name-$LLVM_VERSION-[0-9]*-x86_64.pkg.tar.zst\"" |
              tr -d '"' | sort -V | tail -1)
            [ -n "$file" ] || { echo "no $name $LLVM_VERSION in the Arch Linux Archive" >&2; exit 1; }
            urls+=("$archive/${name:0:1}/$name/$file")
          done
          printf '%s\n' "${urls[@]}"
          pacman -U --noconfirm "${urls[@]}"
          clang --version | head -1
          ld.lld --version
      - uses: actions/checkout@v4
        with:
          path: artcraft
      - name: The fork at its pin and with ArtCraft's patches, side by side, with the daemon's source beside them
        run: |
          git config --global --add safe.directory '*'
          lock=artcraft/mihawk/mihawk.lock.json
          repo=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["repo"])' $lock)
          commit=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' $lock)
          git clone -q --filter=blob:none "$repo" fork
          git -C fork worktree add -q --detach ../pin "$commit"
          git -C fork checkout -q -b artcraft "$commit"
          git -C fork -c user.name=ci -c user.email=ci@example.invalid am -q "$PWD"/artcraft/mihawk/patches/*.patch
          rev=$(sed -n "s/^REV = '\([0-9a-f]*\)'$/\1/p" fork/tools/build-lapy-validation.py)
          git clone -q https://github.com/mpereiraesaa/PS5-Lapy-JB-Daemon.git
          git -C PS5-Lapy-JB-Daemon cat-file -e "$rev^{commit}"
      - name: The daemon's pinned inputs (payload SDK v0.42, the logger header), each checked by SHA-256
        run: |
          sdk_sha=$(sed -n "s/^SDK_SHA = '\([0-9a-f]*\)'$/\1/p" fork/tools/build-lapy-validation.py)
          log_sha=$(sed -n "s/^LOG_SHA = '\([0-9a-f]*\)'$/\1/p" fork/tools/build-lapy-validation.py)
          curl -sSfLo sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
          curl -sSfLo ps5log.h \
            https://raw.githubusercontent.com/mpereiraesaa/prospero-win/e665a2c1f9168c911cf1f6131b832f89a5582fb4/native/ps5log/ps5log.h
          echo "$sdk_sha  sdk.zip" | sha256sum -c
          echo "$log_sha  ps5log.h" | sha256sum -c
          for tree in fork pin; do
            mkdir -p $tree/.deps/prospero-win-e665a2c/native/ps5log
            cp ps5log.h $tree/.deps/prospero-win-e665a2c/native/ps5log/
          done
      - name: Mihawk OS's daemon (PPSA99170) from the pin reproduces its pinned SHA-256
        run: |
          python pin/tools/build-lapy-validation.py --resident --sdk-zip "$PWD/sdk.zip"
          daemon=pin/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client
          pinned=$(sed -n 's/^daemon_sha256=//p' pin/tools/build-production.sh)
          sha256sum "$daemon/lapy-root-daemon.elf"
          echo "$pinned  $daemon/lapy-root-daemon.elf" | sha256sum -c
      - name: When it does not, how it differs from the daemon Mihawk OS released (v3.0.0-alpha-3)
        if: failure()
        run: |
          curl -sSfLo release.zip \
            https://github.com/mihawk-99/PS5_MihawkOS/releases/download/v3.0.0-alpha-3/PS5_MihawkOS-v3.0.0-alpha-3-PPSA99170.zip
          echo "1dd6297c343908060cf56d61b162f6553c5dc6e5894f03ee23f7c547582b2a3d  release.zip" | sha256sum -c
          unzip -q -o release.zip PPSA99170/lapy-root-daemon.elf -d release
          ours=pin/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client/lapy-root-daemon.elf
          for f in "$ours" release/PPSA99170/lapy-root-daemon.elf; do
            echo "== $f"; llvm-readelf -S -n "$f" 2>/dev/null; llvm-readelf -p .comment "$f" 2>/dev/null || true
          done
          llvm-objdump -d --no-show-raw-insn "$ours" | sed 1,3d > ours.s
          llvm-objdump -d --no-show-raw-insn release/PPSA99170/lapy-root-daemon.elf | sed 1,3d > release.s
          diff ours.s release.s | head -80 && echo "the code is the same"
      - name: ArtCraft's daemon (PPSA99278) from the patched fork matches ArtCraft's pin
        run: |
          python fork/tools/build-lapy-validation.py --resident --sdk-zip "$PWD/sdk.zip"
          daemon=fork/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client
          python - "$daemon" artcraft/mihawk/mihawk.lock.json fork/tools/build-production.sh <<'EOF'
          import hashlib, json, re, sys
          from pathlib import Path
          daemon, lock, production = Path(sys.argv[1]), json.loads(Path(sys.argv[2]).read_text()), Path(sys.argv[3]).read_text()
          manifest = json.loads((daemon / 'manifest.json').read_text())
          built = hashlib.sha256((daemon / 'lapy-root-daemon.elf').read_bytes()).hexdigest()
          title = manifest['target_title']
          print(f'built for {title}: {built}')
          pinned = lock.get('lapy_daemon_sha256', {}).get(title)
          in_fork = re.search(r'^daemon_sha256=([0-9a-f]{64})$', production, re.M)[1]
          print(f'mihawk.lock.json pins {pinned}; the patched build-production.sh pins {in_fork}')
          if built != pinned or built != in_fork:
              sys.exit(f'::error::ArtCraft\'s daemon is {built}: pin it in mihawk/mihawk.lock.json lapy_daemon_sha256 '
                       f'and regenerate patch 0007 (python3 -m artcraft_ps5 mihawk identity)')
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lapy-daemon
          path: |
            pin/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client/lapy-root-daemon.elf
            pin/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client/manifest.json
            fork/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client/lapy-root-daemon.elf
            fork/.deps/lapy-validation/source/build/owned_root_daemon-service-verified-client/manifest.json
          if-no-files-found: ignore

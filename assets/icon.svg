<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d1c"/>
      <stop offset="1" stop-color="#121a42"/>
    </linearGradient>
    <radialGradient id="glowMagenta" cx="400" cy="90" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fd1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fd1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="90" cy="460" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="1" stop-color="#ff5ccf"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48bff"/>
      <stop offset="1" stop-color="#5b3df5"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe0ff"/>
      <stop offset="1" stop-color="#1f6fff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#glowMagenta)"/>
  <rect width="512" height="512" fill="url(#glowCyan)"/>

  <!-- Faceted cube, centred -->
  <g transform="translate(109 96) scale(3.2)" filter="url(#shadow)">
    <polygon points="46,4 86,27 46,50 6,27" fill="url(#faceTop)"/>
    <polygon points="6,27 46,50 46,96 6,73" fill="url(#faceLeft)"/>
    <polygon points="46,50 86,27 86,73 46,96" fill="url(#faceRight)"/>
    <path d="M46 4 L86 27 L86 73 L46 96 L6 73 L6 27 Z M6 27 L46 50 L86 27 M46 50 L46 96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round"/>
    <path d="M88 0 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#ffffff"/>
  </g>
</svg>

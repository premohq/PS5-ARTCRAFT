<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="1" stop-color="#0c1230"/>
    </linearGradient>
    <radialGradient id="glowMagenta" cx="980" cy="60" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fd1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff4fd1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="1180" cy="400" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="120" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5ccf"/>
      <stop offset="0.5" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#33d6ff"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="1" stop-color="#ff5ccf"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48bff"/>
      <stop offset="1" stop-color="#5b3df5"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe0ff"/>
      <stop offset="1" stop-color="#1f6fff"/>
    </linearGradient>
    <linearGradient id="windowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b3d"/>
      <stop offset="1" stop-color="#0d1229"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowViolet)"/>
  <rect width="1280" height="400" fill="url(#glowMagenta)"/>
  <rect width="1280" height="400" fill="url(#glowCyan)"/>

  <!-- Brush-stroke swoosh behind the window -->
  <path d="M716 352 C 800 280, 880 390, 1000 310 S 1180 210, 1290 250" fill="none" stroke="url(#brand)" stroke-width="26" stroke-linecap="round" stroke-opacity="0.22"/>
  <path d="M600 120 C 700 60, 820 140, 900 90" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Eyebrow pill -->
  <g transform="translate(72 48)">
    <rect width="172" height="32" rx="16" fill="#33d6ff" fill-opacity="0.10" stroke="#33d6ff" stroke-opacity="0.45"/>
    <circle cx="20" cy="16" r="5" fill="#33d6ff"/>
    <text x="34" y="21.5" font-family="JetBrains Mono" font-weight="600" font-size="14" letter-spacing="3" fill="#9be9ff">PS5 EDITION</text>
  </g>

  <!-- Logo mark: faceted cube -->
  <g transform="translate(72 100)">
    <polygon points="46,4 86,27 46,50 6,27" fill="url(#faceTop)"/>
    <polygon points="6,27 46,50 46,96 6,73" fill="url(#faceLeft)"/>
    <polygon points="46,50 86,27 86,73 46,96" fill="url(#faceRight)"/>
    <path d="M46 4 L86 27 L86 73 L46 96 L6 73 L6 27 Z M6 27 L46 50 L86 27 M46 50 L46 96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M88 0 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#ffffff"/>
  </g>

  <!-- Wordmark -->
  <text x="186" y="181" font-family="Inter Display, Inter" font-weight="800" font-size="90" letter-spacing="-2" fill="#ffffff">Art<tspan fill="url(#brand)">Craft</tspan></text>

  <!-- Tagline -->
  <text x="74" y="250" font-family="Inter" font-weight="500" font-size="26" fill="#c7cfea">The suite of art craft software — now on PS5.</text>

  <!-- Feature chips -->
  <g font-family="Inter" font-weight="600" font-size="16" fill="#e8ecff">
    <g transform="translate(72 284)">
      <rect width="176" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <g transform="translate(16 9)" fill="none" stroke="#ff8ee0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"/>
        <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
      </g>
      <text x="48" y="26.5">USB keyboard</text>
    </g>
    <g transform="translate(260 284)">
      <rect width="186" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <g transform="translate(16 9)" fill="none" stroke="#b4a2ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="3" width="12" height="18" rx="6"/>
        <path d="M12 7v4"/>
      </g>
      <text x="48" y="26.5">Mouse support</text>
    </g>
    <g transform="translate(458 284)">
      <rect width="222" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
      <g transform="translate(16 9)" fill="none" stroke="#7fe6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="4" width="16" height="16" rx="2"/>
        <rect x="9" y="9" width="6" height="6"/>
        <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
      </g>
      <text x="48" y="26.5">Built on Mihawk OS</text>
    </g>
  </g>

  <!-- App launcher window -->
  <g transform="translate(780 52)">
    <g filter="url(#shadow)">
      <rect width="436" height="296" rx="18" fill="url(#windowFill)"/>
    </g>
    <rect x="0.5" y="0.5" width="435" height="295" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M18 0.5 H418 A17.5 17.5 0 0 1 435.5 18 V36 H0.5 V18 A17.5 17.5 0 0 1 18 0.5 Z" fill="#ffffff" fill-opacity="0.04"/>
    <line x1="0.5" y1="36" x2="435.5" y2="36" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f7a"/>
    <circle cx="38" cy="18" r="5" fill="#ffc24d"/>
    <circle cx="56" cy="18" r="5" fill="#3ee07f"/>
    <text x="218" y="22.5" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#8f99c2">artcraft — mihawk os</text>

    <g font-family="Inter" font-weight="600" font-size="14" fill="#f2f4ff">
      <!-- Row 1 -->
      <g transform="translate(22 56)">
        <rect width="120" height="104" rx="14" fill="#ff5ccf" fill-opacity="0.16" stroke="#ff5ccf" stroke-opacity="0.85" stroke-width="1.5"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#ff8ee0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <circle cx="9" cy="9.5" r="1.8"/>
          <path d="M3 17l5-5 4 4 3-3 6 6"/>
        </g>
        <text x="14" y="88">PhotoCraft</text>
      </g>
      <g transform="translate(158 56)">
        <rect width="120" height="104" rx="14" fill="#8b6cff" fill-opacity="0.14" stroke="#8b6cff" stroke-opacity="0.45"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#b4a2ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <path d="M7 4v16M17 4v16M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/>
        </g>
        <text x="14" y="88">FilmCraft</text>
      </g>
      <g transform="translate(294 56)">
        <rect width="120" height="104" rx="14" fill="#ffb547" fill-opacity="0.13" stroke="#ffb547" stroke-opacity="0.45"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#ffcf7f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h9M19 7h1M4 17h3M13 17h7"/>
          <circle cx="16" cy="7" r="2.5"/>
          <circle cx="10" cy="17" r="2.5"/>
        </g>
        <text x="14" y="88">LightCraft</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(22 176)">
        <rect width="120" height="104" rx="14" fill="#ff6b6b" fill-opacity="0.13" stroke="#ff6b6b" stroke-opacity="0.45"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#ff9a9a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h8l5 5v13H6z"/>
          <path d="M14 3v5h5"/>
          <path d="M9 13h6M9 17h6"/>
        </g>
        <text x="14" y="88">PdfCraft</text>
      </g>
      <g transform="translate(158 176)">
        <rect width="120" height="104" rx="14" fill="#33d6ff" fill-opacity="0.12" stroke="#33d6ff" stroke-opacity="0.45"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#7fe6ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 3l1.8 4.7 4.7 1.8-4.7 1.8L11 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/>
          <path d="M18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/>
        </g>
        <text x="14" y="88">EffectCraft</text>
      </g>
      <g transform="translate(294 176)">
        <rect width="120" height="104" rx="14" fill="#3ee07f" fill-opacity="0.12" stroke="#3ee07f" stroke-opacity="0.45"/>
        <g transform="translate(14 14) scale(1.25)" fill="none" stroke="#86efb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.6 7.6"/>
          <circle cx="11" cy="11" r="2"/>
        </g>
        <text x="14" y="88">DesignCraft</text>
      </g>
    </g>

    <!-- Mouse cursor hovering PhotoCraft -->
    <g transform="translate(118 122)">
      <path d="M0 0 L0 26 L7 19.5 L11.5 30 L16 28 L11.5 17.8 L21 17.8 Z" fill="#ffffff" stroke="#0b0f24" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

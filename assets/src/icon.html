<!doctype html>
<!-- The repository's icon, 512x512: the whole suite, each app's own icon. The first app sits large in the middle and
     the other twelve frame it, four by four. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="artcraft.css">
<style>
  .card { width: 512px; height: 512px; display: grid; padding: 22px; gap: 12px; border-width: 0;
          grid-template: repeat(4, 1fr) / repeat(4, 1fr); }
  .card img { width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(17, 17, 17, 0.24)); }
  .card img.lead { grid-area: 2 / 2 / 4 / 4; filter: drop-shadow(0 8px 14px rgba(17, 17, 17, 0.30)); }
</style>
</head>
<body>
<div class="card" id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  const [lead, ...rest] = window.SUITE;
  grid.appendChild(icon(lead)).className = 'lead';
  for (const app of rest) grid.appendChild(icon(app));
</script>
</body>
</html>
